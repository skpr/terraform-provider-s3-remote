version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - github.com/aws/*
        update-types: [ "minor", "patch" ]
      aws-sdk-major:
        patterns:
          - github.com/aws/*
        update-types: [ "major" ]
      golang-x:
        patterns:
          - golang.org/x/*
        update-types: [ "minor", "patch" ]
      golang-x-major:
        patterns:
          - golang.org/x/*
        update-types: [ "major" ]
      gomod-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2
