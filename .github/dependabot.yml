version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      aws-sdk:
        patterns:
          - github.com/aws/*
        update-types: [ "minor", "patch" ]
      aws-sdk-major:
        patterns:
          - github.com/aws/*
        update-types: [ "major" ]
      golang-x:
        patterns:
          - golang.org/x/*
        update-types: [ "minor", "patch" ]
      golang-x-major:
        patterns:
          - golang.org/x/*
        update-types: [ "major" ]
      gomod-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "07:30"
      timezone: "Australia/Sydney"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions-deps:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      github-actions-major-deps:
        patterns: [ "*" ]
        update-types: [ "major" ]
      github-actions-security-deps:
        applies-to: security-updates
        patterns: [ "*" ]
    cooldown:
      default-days: 2
