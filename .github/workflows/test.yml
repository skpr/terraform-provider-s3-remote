name: 🧪 Test

on:
  push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v7

      - name: 📦 Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: 🧪 Test
        run: make test

      - name: 🛡️ Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
