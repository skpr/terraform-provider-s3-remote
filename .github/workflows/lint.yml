name: 📋 Lint

on:
  push

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v7

      - name: 📦 Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: 📋 Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
